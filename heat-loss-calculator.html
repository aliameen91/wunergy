<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heat Loss Estimator — Wunergy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --surface-alt:#EEF1F6;
    --border:#DCE2EA;
    --text:#1A2333;
    --text-muted:#5B6472;
    --cold:#2E5EAA;
    --warm:#E2672B;
    --gradient:linear-gradient(90deg,var(--cold) 0%,#7C6FBE 50%,var(--warm) 100%);
    --accent2:#0F766E;
    --danger:#C1432D;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 24px -12px rgba(20,30,50,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px;}
  h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;margin:0;letter-spacing:-0.01em;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--cold);
    font-weight:600;
    margin-bottom:8px;
    display:block;
  }
  header.top{margin-bottom:28px;}
  header.top h1{font-size:26px;font-weight:600;}
  header.top p{color:var(--text-muted);font-size:14px;margin-top:6px;max-width:52ch;line-height:1.5;}

  /* step indicator */
  .steps{display:flex;align-items:center;gap:0;margin:24px 0 32px;}
  .step-item{display:flex;align-items:center;flex:1;}
  .step-dot{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    background:var(--surface-alt);color:var(--text-muted);
    border:1.5px solid var(--border);
    flex-shrink:0;
    transition:all .25s ease;
  }
  .step-item.active .step-dot{background:var(--cold);border-color:var(--cold);color:#fff;}
  .step-item.done .step-dot{background:var(--accent2);border-color:var(--accent2);color:#fff;}
  .step-label{font-size:12px;color:var(--text-muted);margin-left:8px;white-space:nowrap;}
  .step-item.active .step-label{color:var(--text);font-weight:600;}
  .step-line{flex:1;height:2px;background:var(--border);margin:0 10px;position:relative;overflow:hidden;}
  .step-line.filled::after{content:'';position:absolute;inset:0;background:var(--gradient);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:16px;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:12.5px;font-weight:600;color:var(--text);}
  label .hint{font-weight:400;color:var(--text-muted);}
  input[type="text"],input[type="number"],select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1.5px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--text);
    width:100%;
  }
  input:focus-visible,select:focus-visible,button:focus-visible{
    outline:2.5px solid var(--cold);
    outline-offset:1px;
  }
  .checkrow{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;}
  .checkrow input{width:16px;height:16px;accent-color:var(--warm);}

  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:11px 20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--text);color:#fff;}
  .btn-primary:hover{opacity:.88;}
  .btn-primary:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--text-muted);color:var(--text);}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid transparent;padding:6px 10px;font-size:12.5px;}
  .btn-danger:hover{background:#FBEAE6;}
  .btn-row{display:flex;justify-content:space-between;margin-top:24px;gap:12px;}

  /* room cards */
  .room-card{border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .room-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;background:var(--surface-alt);cursor:pointer;
  }
  .room-head-left{display:flex;align-items:center;gap:10px;}
  .room-num{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    width:22px;height:22px;border-radius:6px;background:var(--text);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .room-name{font-weight:600;font-size:14.5px;}
  .room-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-muted);margin-left:2px;}
  .chevron{transition:transform .2s ease;color:var(--text-muted);}
  .room-card.collapsed .chevron{transform:rotate(-90deg);}
  .room-body{padding:16px;}
  .room-card.collapsed .room-body{display:none;}
  .live-calc{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cold);
    background:var(--surface-alt);padding:8px 10px;border-radius:6px;margin-top:10px;
  }

  .add-room-btn{
    width:100%;padding:14px;border-radius:var(--radius);
    border:1.5px dashed var(--border);background:transparent;
    color:var(--text-muted);font-weight:600;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .add-room-btn:hover{border-color:var(--cold);color:var(--cold);}

  /* results */
  .summary-card{
    background:var(--text);color:#fff;border-radius:var(--radius);padding:28px 24px;margin-bottom:18px;
    position:relative;overflow:hidden;
  }
  .summary-card::before{
    content:'';position:absolute;inset:0;background:var(--gradient);opacity:.18;
  }
  .summary-inner{position:relative;}
  .summary-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;}
  .summary-value{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;margin:6px 0 2px;line-height:1;}
  .summary-value span{font-size:18px;font-weight:500;opacity:.75;margin-left:6px;}
  .summary-sub{font-size:13px;opacity:.75;margin-top:8px;line-height:1.5;}

  .room-result-row{
    display:grid;grid-template-columns:1.3fr .6fr .5fr 1.5fr;gap:10px;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;
  }
  .room-result-row:last-child{border-bottom:none;}
  .room-result-row.header-row{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-muted);font-weight:600;padding-bottom:8px;
  }
  .rr-name{font-weight:600;}
  .rr-value{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .heat-bar-track{background:var(--surface-alt);border-radius:5px;height:9px;overflow:hidden;}
  .heat-bar-fill{height:100%;background:var(--gradient);border-radius:5px;}

  .caveat{
    font-size:12.5px;color:var(--text-muted);line-height:1.6;
    background:var(--surface-alt);border-radius:8px;padding:14px 16px;margin-top:16px;
  }
  .caveat strong{color:var(--text);}

  .error-text{color:var(--danger);font-size:12px;margin-top:2px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:20px;background:var(--surface-alt);color:var(--text-muted);
  }

  @media(max-width:560px){
    .field-grid{grid-template-columns:1fr;}
    .step-label{display:none;}
    .summary-value{font-size:34px;}
    .room-result-row{grid-template-columns:1fr .5fr .5fr;}
    .room-result-row > :nth-child(4){display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="eyebrow">Wunergy · Design Estimate</span>
    <h1>Heat Loss Estimator</h1>
    <p>No current EPC on the property? Enter the building's construction details below for a room-by-room indicative heat loss estimate. A design survey confirms the final figure.</p>
  </header>

  <div class="steps" id="stepIndicator"></div>

  <div id="stepContent"></div>

</div>

<script>
/* ---------------------------------------------------------
   DATA TABLES — indicative defaults, not the licensed CIBSE
   dataset or the certified MCS methodology. Editable in-line.
--------------------------------------------------------- */

const AGE_BANDS = [
  {id:'pre1900',  label:'Before 1900'},
  {id:'1900-1949',label:'1900 – 1949'},
  {id:'1950-1975',label:'1950 – 1975'},
  {id:'1976-1990',label:'1976 – 1990'},
  {id:'1991-2006',label:'1991 – 2006'},
  {id:'2007-2011',label:'2007 – 2011'},
  {id:'2012-plus',label:'2012 onwards'}
];

// approximate indicative U-values (W/m²K) by element, per age band
const U_VALUES = {
  'pre1900':   {wall:2.10, roof:2.30, floor:1.20, window:4.80, door:3.00},
  '1900-1949': {wall:1.60, roof:1.50, floor:1.00, window:4.80, door:3.00},
  '1950-1975': {wall:1.50, roof:0.60, floor:0.70, window:4.80, door:3.00},
  '1976-1990': {wall:1.00, roof:0.35, floor:0.50, window:2.80, door:3.00},
  '1991-2006': {wall:0.45, roof:0.25, floor:0.35, window:2.00, door:2.20},
  '2007-2011': {wall:0.30, roof:0.18, floor:0.22, window:1.60, door:2.00},
  '2012-plus': {wall:0.18, roof:0.13, floor:0.13, window:1.40, door:1.40}
};

// infiltration multiplier applied to base room ACH by age band
const INFILTRATION_MULT = {
  'pre1900':2.0,'1900-1949':1.6,'1950-1975':1.3,'1976-1990':1.1,
  '1991-2006':1.0,'2007-2011':0.8,'2012-plus':0.6
};

const ROOM_TYPES = {
  living:   {label:'Living / Dining room', internalTemp:21, baseAch:0.5},
  bedroom:  {label:'Bedroom',              internalTemp:18, baseAch:0.5},
  bathroom: {label:'Bathroom / En-suite',  internalTemp:22, baseAch:1.5},
  kitchen:  {label:'Kitchen',              internalTemp:18, baseAch:1.5},
  hall:     {label:'Hallway / Landing',    internalTemp:18, baseAch:1.0},
  other:    {label:'Other habitable room', internalTemp:18, baseAch:0.5}
};

// simplified postcode-area → external design temperature (°C)
// approximated from CIBSE Guide A reference sites — indicative only
const POSTCODE_DESIGN_TEMP = {
  AB:-6.4, DD:-5.1, EH:-4.6, G:-4.6, KA:-4.3, KY:-4.9, PA:-4.6, FK:-5.1,
  BT:-3.5,
  LL:-3.7, SA:-3.4, CF:-3.2, NP:-3.2,
  NE:-4.4, SR:-4.4, DH:-4.4, DL:-4.6, TS:-4.0,
  LS:-4.3, BD:-4.5, HD:-4.3, HX:-4.3, WF:-4.2, YO:-4.6, HG:-4.6, S:-4.2, DN:-3.9,
  M:-3.8, OL:-4.0, BL:-4.0, WN:-3.8, SK:-3.8, WA:-3.5, L:-3.4, PR:-4.0, FY:-4.0, LA:-4.2,
  CH:-3.4, CW:-3.6, ST:-4.0, DE:-4.0, NG:-3.9, LN:-3.7, LE:-3.7,
  B:-3.6, WS:-3.8, WV:-3.9, DY:-3.8, CV:-3.6, WR:-3.5, HR:-3.6, TF:-3.9, SY:-3.9,
  NR:-3.3, IP:-3.3, CB:-3.5, PE:-3.6, CO:-3.2,
  NN:-3.6, MK:-3.4, LU:-3.2, HP:-3.2, OX:-3.4, RG:-3.2, SL:-3.0, GU:-3.0,
  SN:-3.4, GL:-3.6, BS:-3.4, BA:-3.4, TA:-3.5, DT:-3.0, BH:-2.9, SP:-3.2,
  EX:-2.8, PL:-2.5, TQ:-2.6, TR:-1.9,
  CT:-2.6, ME:-2.8, DA:-2.9, TN:-2.9, RH:-2.9,
  BN:-2.7, PO:-2.9, SO:-2.9,
  E:-2.9, EC:-2.9, WC:-2.9, N:-3.0, NW:-3.0, SE:-2.9, SW:-2.9, W:-2.9, KT:-2.9,
  IG:-2.9, RM:-2.9, CR:-2.9, BR:-2.9, HA:-3.0, UB:-3.0, TW:-2.9, EN:-3.1, WD:-3.1
};
const DEFAULT_DESIGN_TEMP = -3.7; // national indicative fallback

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let state = {
  step: 0,
  property: { postcode:'', ageBand:'1976-1990', altitude:0 },
  rooms: []
};
let roomCounter = 0;

function newRoom(){
  roomCounter++;
  return {
    id: roomCounter,
    name: 'Room ' + roomCounter,
    type: 'living',
    length: '', width: '', height: 2.4,
    extWallArea: '', windowArea: '',
    hasDoor: false, doorArea: 1.85,
    groundFloor: false, topFloor: false,
    collapsed: false
  };
}
state.rooms.push(newRoom(), newRoom());
state.rooms[0].name = 'Living Room';
state.rooms[1].name = 'Bedroom 1'; state.rooms[1].type = 'bedroom';

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */
const STEP_LABELS = ['Property', 'Rooms', 'Results'];

function render(){
  renderSteps();
  if(state.step === 0) renderPropertyStep();
  else if(state.step === 1) renderRoomsStep();
  else renderResultsStep();
}

function renderSteps(){
  const el = document.getElementById('stepIndicator');
  let html = '';
  STEP_LABELS.forEach((label,i)=>{
    const cls = i < state.step ? 'done' : (i === state.step ? 'active' : '');
    html += `<div class="step-item ${cls}">
      <div class="step-dot">${i < state.step ? '✓' : i+1}</div>
      <div class="step-label">${label}</div>
    </div>`;
    if(i < STEP_LABELS.length-1){
      html += `<div class="step-line ${i < state.step ? 'filled':''}"></div>`;
    }
  });
  el.innerHTML = html;
}

function renderPropertyStep(){
  const p = state.property;
  document.getElementById('stepContent').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:16px;">Property details</h3>
      <div class="field-grid">
        <div class="field">
          <label>Postcode <span class="hint">(sets external design temp)</span></label>
          <input type="text" id="f-postcode" placeholder="e.g. LS6 3AB" value="${p.postcode}">
        </div>
        <div class="field">
          <label>Construction age band</label>
          <select id="f-ageband">
            ${AGE_BANDS.map(b=>`<option value="${b.id}" ${b.id===p.ageBand?'selected':''}>${b.label}</option>`).join('')}
          </select>
        </div>
        <div class="field full">
          <label>Altitude above sea level <span class="hint">(m, optional — leave 0 if unsure)</span></label>
          <input type="number" id="f-altitude" min="0" value="${p.altitude}">
        </div>
      </div>
    </div>
    <div class="btn-row">
      <div></div>
      <button class="btn btn-primary" onclick="goStep(1)">Continue to rooms →</button>
    </div>
  `;
  document.getElementById('f-postcode').oninput = e => state.property.postcode = e.target.value;
  document.getElementById('f-ageband').onchange = e => state.property.ageBand = e.target.value;
  document.getElementById('f-altitude').oninput = e => state.property.altitude = parseFloat(e.target.value)||0;
}

function renderRoomsStep(){
  let html = state.rooms.map((r,i)=>roomCardHtml(r,i)).join('');
  html += `<button class="add-room-btn" onclick="addRoom()">+ Add another room</button>`;
  document.getElementById('stepContent').innerHTML = `
    ${html}
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goStep(0)">← Back</button>
      <button class="btn btn-primary" id="calcBtn" onclick="goStep(2)">Calculate heat loss →</button>
    </div>
  `;
  wireRoomInputs();
  updateCalcButtonState();
}

function roomCardHtml(r,i){
  const area = (parseFloat(r.length)||0) * (parseFloat(r.width)||0);
  const vol = area * (parseFloat(r.height)||0);
  return `
  <div class="room-card ${r.collapsed?'collapsed':''}" data-id="${r.id}">
    <div class="room-head" onclick="toggleRoom(${r.id})">
      <div class="room-head-left">
        <div class="room-num">${i+1}</div>
        <div>
          <span class="room-name">${escapeHtml(r.name) || 'Room '+(i+1)}</span>
          <span class="room-meta">${area? area.toFixed(1)+'m² · '+vol.toFixed(1)+'m³':''}</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn-danger" onclick="event.stopPropagation();removeRoom(${r.id})" ${state.rooms.length<=1?'disabled style="opacity:.3;cursor:not-allowed;"':''}>Remove</button>
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="room-body">
      <div class="field-grid">
        <div class="field">
          <label>Room name</label>
          <input type="text" data-room="${r.id}" data-field="name" type="text" value="${escapeHtml(r.name)}">
        </div>
        <div class="field">
          <label>Room type</label>
          <select data-room="${r.id}" data-field="type">
            ${Object.entries(ROOM_TYPES).map(([k,v])=>`<option value="${k}" ${k===r.type?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Length (m)</label>
          <input type="number" step="0.1" min="0" data-room="${r.id}" data-field="length" value="${r.length}">
        </div>
        <div class="field">
          <label>Width (m)</label>
          <input type="number" step="0.1" min="0" data-room="${r.id}" data-field="width" value="${r.width}">
        </div>
        <div class="field">
          <label>Ceiling height (m)</label>
          <input type="number" step="0.1" min="0" data-room="${r.id}" data-field="height" value="${r.height}">
        </div>
        <div class="field">
          <label>External wall area <span class="hint">(m², gross)</span></label>
          <input type="number" step="0.1" min="0" data-room="${r.id}" data-field="extWallArea" value="${r.extWallArea}">
        </div>
        <div class="field">
          <label>Window area <span class="hint">(m²)</span></label>
          <input type="number" step="0.1" min="0" data-room="${r.id}" data-field="windowArea" value="${r.windowArea}">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <div class="checkrow"><input type="checkbox" data-room="${r.id}" data-field="hasDoor" ${r.hasDoor?'checked':''}> Has external door</div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <div class="checkrow"><input type="checkbox" data-room="${r.id}" data-field="groundFloor" ${r.groundFloor?'checked':''}> Ground floor (exposed floor)</div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <div class="checkrow"><input type="checkbox" data-room="${r.id}" data-field="topFloor" ${r.topFloor?'checked':''}> Top floor (roof above)</div>
        </div>
      </div>
      <div class="live-calc">Floor area: ${area? area.toFixed(1):'—'} m² &nbsp;·&nbsp; Volume: ${vol? vol.toFixed(1):'—'} m³</div>
    </div>
  </div>`;
}

function wireRoomInputs(){
  document.querySelectorAll('[data-room]').forEach(el=>{
    const handler = () => {
      const room = state.rooms.find(r=>r.id === parseInt(el.dataset.room));
      const field = el.dataset.field;
      if(el.type === 'checkbox') room[field] = el.checked;
      else if(el.type === 'number') room[field] = el.value === '' ? '' : parseFloat(el.value);
      else room[field] = el.value;
      // live update just the header meta + calc line without full re-render (keeps focus)
      const card = document.querySelector(`.room-card[data-id="${room.id}"]`);
      const area = (parseFloat(room.length)||0) * (parseFloat(room.width)||0);
      const vol = area * (parseFloat(room.height)||0);
      card.querySelector('.room-name').textContent = room.name || ('Room');
      card.querySelector('.room-meta').textContent = area ? area.toFixed(1)+'m² · '+vol.toFixed(1)+'m³' : '';
      card.querySelector('.live-calc').textContent = `Floor area: ${area? area.toFixed(1):'—'} m² · Volume: ${vol? vol.toFixed(1):'—'} m³`;
      updateCalcButtonState();
    };
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', handler);
  });
}

function updateCalcButtonState(){
  const btn = document.getElementById('calcBtn');
  if(!btn) return;
  const valid = state.rooms.every(r => r.length && r.width && r.height);
  btn.disabled = !valid;
  btn.title = valid ? '' : 'Enter length, width and height for every room';
}

function toggleRoom(id){
  const r = state.rooms.find(r=>r.id===id);
  r.collapsed = !r.collapsed;
  document.querySelector(`.room-card[data-id="${id}"]`).classList.toggle('collapsed');
}
function addRoom(){ state.rooms.push(newRoom()); renderRoomsStep(); }
function removeRoom(id){
  if(state.rooms.length<=1) return;
  state.rooms = state.rooms.filter(r=>r.id!==id);
  renderRoomsStep();
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------------------------------------------------
   CALCULATION
--------------------------------------------------------- */
function getDesignTemp(postcode, altitude){
  const clean = (postcode||'').toUpperCase().replace(/\s/g,'');
  const match = clean.match(/^([A-Z]{1,2})/);
  let base = DEFAULT_DESIGN_TEMP;
  if(match){
    const twoLetter = match[1];
    const oneLetter = match[1][0];
    if(POSTCODE_DESIGN_TEMP[twoLetter] !== undefined) base = POSTCODE_DESIGN_TEMP[twoLetter];
    else if(POSTCODE_DESIGN_TEMP[oneLetter] !== undefined) base = POSTCODE_DESIGN_TEMP[oneLetter];
  }
  const altCorrection = ((altitude||0)/100) * 0.6;
  return base - altCorrection;
}

function calculateRoom(room, externalTemp, ageBand){
  const area = (parseFloat(room.length)||0) * (parseFloat(room.width)||0);
  const vol = area * (parseFloat(room.height)||0);
  const roomType = ROOM_TYPES[room.type];
  const internalTemp = roomType.internalTemp;
  const deltaT = Math.max(internalTemp - externalTemp, 0);
  const u = U_VALUES[ageBand];

  const windowArea = parseFloat(room.windowArea)||0;
  const doorArea = room.hasDoor ? (parseFloat(room.doorArea)||1.85) : 0;
  const grossWall = parseFloat(room.extWallArea)||0;
  const netWall = Math.max(grossWall - windowArea - doorArea, 0);

  let fabricLoss = 0;
  fabricLoss += netWall * u.wall * deltaT;
  fabricLoss += windowArea * u.window * deltaT;
  fabricLoss += doorArea * u.door * deltaT;
  if(room.topFloor) fabricLoss += area * u.roof * deltaT;
  if(room.groundFloor) fabricLoss += area * u.floor * deltaT;

  const ach = roomType.baseAch * INFILTRATION_MULT[ageBand];
  const ventLoss = 0.33 * ach * vol * deltaT;

  const total = fabricLoss + ventLoss;
  return { area, vol, deltaT, fabricLoss, ventLoss, total, ach };
}

function renderResultsStep(){
  const externalTemp = getDesignTemp(state.property.postcode, state.property.altitude);
  const ageBand = state.property.ageBand;
  const results = state.rooms.map(r => ({room:r, calc: calculateRoom(r, externalTemp, ageBand)}));
  const totalW = results.reduce((s,r)=>s+r.calc.total,0);
  const totalKw = totalW/1000;
  const maxRoom = Math.max(...results.map(r=>r.calc.total), 1);

  const rows = results.map(r => `
    <div class="room-result-row">
      <div class="rr-name">${escapeHtml(r.room.name)}<div style="color:var(--text-muted);font-weight:400;font-size:11.5px;">${ROOM_TYPES[r.room.type].label}</div></div>
      <div class="rr-value">${r.calc.deltaT.toFixed(1)}°C ΔT</div>
      <div class="rr-value">${Math.round(r.calc.total)} W</div>
      <div class="heat-bar-track"><div class="heat-bar-fill" style="width:${(r.calc.total/maxRoom*100).toFixed(0)}%"></div></div>
    </div>
  `).join('');

  document.getElementById('stepContent').innerHTML = `
    <div class="summary-card">
      <div class="summary-inner">
        <div class="summary-eyebrow">Indicative design heat loss</div>
        <div class="summary-value">${totalKw.toFixed(2)}<span>kW</span></div>
        <div class="summary-sub">
          External design temp used: ${externalTemp.toFixed(1)}°C &nbsp;·&nbsp; ${state.rooms.length} room${state.rooms.length!==1?'s':''} &nbsp;·&nbsp; Age band: ${AGE_BANDS.find(b=>b.id===ageBand).label}
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px;">Room-by-room breakdown</h3>
      <div class="room-result-row header-row">
        <div>Room</div><div>Design ΔT</div><div>Heat loss</div><div>Relative share</div>
      </div>
      ${rows}
    </div>

    <div class="caveat">
      <strong>This is an indicative estimate</strong>, not a certified MCS heat loss calculation. It uses default U-values and infiltration rates by construction age band rather than measured fabric performance. The figure needed for Boiler Upgrade Scheme eligibility and final system design is produced by an MCS-certified assessor at an in-home survey.
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goStep(1)">← Edit rooms</button>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" onclick="downloadCsv()">Download CSV</button>
        <button class="btn btn-primary" onclick="alert('Wire this button to your lead-capture / booking flow.')">Book a design survey</button>
      </div>
    </div>
  `;

  window._lastResults = { externalTemp, results, totalKw };
}

function downloadCsv(){
  const { externalTemp, results, totalKw } = window._lastResults;
  let csv = 'Room,Type,Area (m2),Volume (m3),Design ΔT (C),Fabric loss (W),Ventilation loss (W),Total loss (W)\n';
  results.forEach(r=>{
    csv += [
      r.room.name, ROOM_TYPES[r.room.type].label, r.calc.area.toFixed(1), r.calc.vol.toFixed(1),
      r.calc.deltaT.toFixed(1), Math.round(r.calc.fabricLoss), Math.round(r.calc.ventLoss), Math.round(r.calc.total)
    ].join(',') + '\n';
  });
  csv += `\nTotal design heat loss (kW),${totalKw.toFixed(2)}\n`;
  csv += `External design temp (C),${externalTemp.toFixed(1)}\n`;
  csv += `Postcode,${state.property.postcode}\nAge band,${state.property.ageBand}\n`;

  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'wunergy-heat-loss-estimate.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function goStep(n){
  if(n === 2){
    const valid = state.rooms.every(r => r.length && r.width && r.height);
    if(!valid){ updateCalcButtonState(); return; }
  }
  state.step = n;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

render();
</script>
